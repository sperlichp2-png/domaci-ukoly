name: Sestavit APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Prejmenovat APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DomaciUkoly.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DomaciUkoly-apk
          path: DomaciUkoly.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Domácí úkoly ${{ github.run_number }}
          files: DomaciUkoly.apk
          make_latest: true
