name: Test spuštění v emulátoru
on: [push, workflow_dispatch]
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Spustit v emulátoru
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n cz.sperlich.domaciukoly/.MainActivity
            sleep 25
            adb shell am start -W -n cz.sperlich.domaciukoly/.MainActivity
            sleep 5
            adb shell run-as cz.sperlich.domaciukoly cat files/ukoly.json > ukoly.json || true
            adb shell am start -W -n cz.sperlich.domaciukoly/.MainActivity --ez setSick true
            sleep 30
            adb shell run-as cz.sperlich.domaciukoly ls -l files shared_prefs > ls.txt 2>&1 || true
            adb shell run-as cz.sperlich.domaciukoly cat shared_prefs/nastaveni.xml >> ls.txt 2>&1 || true
            adb shell run-as cz.sperlich.domaciukoly cat files/nemocne.json > nemocne.json || true
            adb logcat -d > logcat.txt || true
            adb shell pidof cz.sperlich.domaciukoly > pid.txt || true
            adb exec-out screencap -p > screen.png || true
      - name: Vyhodnotit
        if: always()
        run: |
          grep -A40 "FATAL EXCEPTION" logcat.txt > crash.txt || true
          grep -E "domaciukoly|AndroidRuntime" logcat.txt | grep -E " E |FATAL|Exception" | head -60 > errs.txt || true
          echo "PID: $(cat pid.txt 2>/dev/null)"
          for f in ukoly nemocne; do
            python3 - "$f.json" <<'PY' > "$f.txt" || echo "nelze přečíst" > "$f.txt"
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print('chyba:', d.get('lastError'), '| dnů:', len(d.get('days',[])))
          for day in d.get('days',[])[-6:]:
              print('==', day['date'], '[' + day.get('week','') + ']')
              for it in day['items']:
                  print('   ', it['subject'], '|', it['text'][:90], '|', it.get('link',''))
          PY
            echo "::notice title=$f::$(sed 's/%/%25/g' $f.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
          echo "::notice title=soubory::$(sed 's/%/%25/g' ls.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
          grep -E "ANR in|not responding" logcat.txt | head -5 || true
          if [ -s crash.txt ]; then
            echo "::error title=Pad::$(head -60 crash.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          if [ ! -s pid.txt ]; then
            echo "::error::Aplikace po spuštění neběží"
            echo "::error title=Chyby::$(head -40 errs.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          echo "::notice::Aplikace běží, žádný pád."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-vystup
          path: |
            logcat.txt
            screen.png
            ukoly.json
            nemocne.json
